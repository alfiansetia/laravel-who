services:
  # PHP-FPM: eksekusi Laravel, tidak diakses langsung dari luar
  who-app:
    build:
      context: .
      target: app
    container_name: who-app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # NOTE: .env sengaja TIDAK dimuat via env_file. Compose menginterpolasi
    # karakter $ (mis. "$2y$12$tf/..." pada ADMIN_PASS bcrypt menjadi rusak
    # + warning 'The "tf" variable is not set'). .env sudah di-mount ke
    # /var/www/html/.env di bawah, dan itu yang dibaca Laravel.
    expose:
      - "9000"
    volumes:
      # Persistensi storage + database sqlite + .env agar bisa diubah tanpa rebuild
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./.env:/var/www/html/.env:ro
    networks:
      app-network:
        aliases:
          - who-app
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nginx: satu-satunya yang menerima HTTP, ditembak Cloudflare Tunnel
  who-web:
    build:
      context: .
      target: web
    container_name: who-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # Hanya expose ke dalam network, tanpa publish port ke host.
    # Cloudflare Tunnel (di network yang sama) forward ke http://who-web:80
    expose:
      - "80"
    volumes:
      # Mount yang sama dengan php-fpm (read-only): dibaca lewat
      # symlink public/storage -> /var/www/html/storage/app/public
      - ./storage:/var/www/html/storage:ro
    networks:
      app-network:
        aliases:
          - who-web
    depends_on:
      who-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Worker antrean. Timeout 600 dtk agar import file besar tidak terputus.
  # Aktif kalau QUEUE_CONNECTION=database di .env (default lokal masih sync).
  who-worker:
    build:
      context: .
      target: app
    container_name: who-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # NOTE: sama seperti who-app — jangan pakai env_file (Compose merusak
    # nilai mengandung $, mis. ADMIN_PASS). .env dibaca via mount di bawah.
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=600", "--max-time=3600"]
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./.env:/var/www/html/.env:ro
    networks:
      - app-network
    depends_on:
      who-app:
        condition: service_healthy

  # Scheduler Laravel (pengganti cron). Satu saja per app.
  who-scheduler:
    build:
      context: .
      target: app
    container_name: who-scheduler
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # NOTE: sama seperti who-app — jangan pakai env_file (Compose merusak
    # nilai mengandung $, mis. ADMIN_PASS). .env dibaca via mount di bawah.
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./.env:/var/www/html/.env:ro
    networks:
      - app-network
    depends_on:
      who-app:
        condition: service_healthy

networks:
  # Join ke network yang sudah dipakai service mysql + cloudflared.
  # Pastikan network ini sudah ada (dibuat oleh stack mysql):
  #   docker network create app-network
  # Dev lokal tanpa stack mysql: ganti ke `external: false` sementara
  # atau buat network di atas sebelum `docker compose up`.
  app-network:
    name: app-network
    external: true
