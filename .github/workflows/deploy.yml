name: Deploy to VPS

# Auto-deploy: jalan otomatis setiap push ke main. Manual via tab Actions tetap bisa.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git fetch origin master
            git reset --hard origin/master
            # --build wajib: source ikut di-bake ke image (COPY . .),
            # tanpa ini container jalan dengan kode lama.
            # who-web/worker/scheduler ikut ter-recreate otomatis karena satu image.
            docker compose up -d --build --remove-orphans
            # -T: tanpa TTY (SSH non-interaktif). -u www-data: agar file
            # cache/migrate milik www-data, bukan root.
            docker compose exec -T -u www-data who-app php artisan migrate --force
            docker compose exec -T -u www-data who-app php artisan optimize
            docker compose ps
