; Hardening anti RCE / upload-to-shell (phar, phtml, path-info).
; Dipakai production: php.ini-production + file ini.
expose_php = Off
cgi.fix_pathinfo = 0
allow_url_include = Off
allow_url_fopen = On
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
file_uploads = On
; Jangan eksekusi PHAR sebagai script via web
phar.readonly = On
; Batasi zona waktu & error bocor ke klien
display_errors = Off
log_errors = On
